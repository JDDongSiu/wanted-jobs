name: Update data and deploy

# 수집과 배포를 한 워크플로에서 처리한다.
# GITHUB_TOKEN 으로 만든 커밋은 다른 워크플로를 트리거하지 않으므로,
# 배포를 별도 워크플로로 분리하면 데이터 갱신 후 배포가 실행되지 않는다.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *' # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r crawler/requirements.txt

      # SARAMIN_API_KEY 시크릿이 없으면 사람인만 건너뛰고 나머지는 수집한다.
      - name: Crawl job postings
        run: python build_jobs.py
        working-directory: crawler
        env:
          SARAMIN_API_KEY: ${{ secrets.SARAMIN_API_KEY }}

      # 재실행이나 연속 실행으로 원격이 앞서 있을 수 있어 rebase 후 푸시한다.
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/jobs.json jobs.csv
          if git diff --staged --quiet; then
            echo "데이터 변경 없음"
            exit 0
          fi
          git commit -m "chore: update job data"
          git pull --rebase origin main
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Pages 주소가 /<저장소명>/ 하위라서 base 경로를 맞춰준다.
      - name: Build
        run: npm run build -- --base="/${GITHUB_REPOSITORY#*/}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
