name: Update data and deploy

# 수집과 배포를 한 워크플로에서 처리한다.
# GITHUB_TOKEN 으로 만든 커밋은 다른 워크플로를 트리거하지 않으므로,
# 배포를 별도 워크플로로 분리하면 데이터 갱신 후 배포가 실행되지 않는다.
#
# 여기서는 수집 결과를 커밋하지 않는다. 저장소의 데이터 파일을 쓰는 쪽은 이 PC 하나뿐이다.
# 양쪽이 함께 커밋하면 같은 파일을 두고 매번 충돌한다.
# 커밋하지 않아도 배포되는 사이트는 이 실행에서 새로 수집한 데이터를 담으며,
# 원티드처럼 CI 에서 막히는 소스는 저장소에 있는 직전(로컬 수집) 데이터를 그대로 쓴다.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *' # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r crawler/requirements.txt

      # SARAMIN_API_KEY 시크릿이 없으면 사람인만 건너뛰고 나머지는 수집한다.
      - name: Crawl job postings
        run: python build_jobs.py
        working-directory: crawler
        env:
          SARAMIN_API_KEY: ${{ secrets.SARAMIN_API_KEY }}

      # 보건관리자·HSE 공고. NAVER_CLIENT_ID/SECRET 이 없으면 네이버 블로그만 건너뛴다.
      - name: Crawl health-manager postings
        run: python build_hse.py
        working-directory: crawler
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Pages 주소가 /<저장소명>/ 하위라서 base 경로를 맞춰준다.
      - name: Build
        run: npm run build -- --base="/${GITHUB_REPOSITORY#*/}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
