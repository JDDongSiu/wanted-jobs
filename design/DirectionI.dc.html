<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard,
        "Malgun Gothic", system-ui, sans-serif;
      background: #eceae5;
      color: #1c1a17;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #b5541f; text-decoration: none; }
    a:hover { color: #8d3f16; }
  </style>
</helmet>

<div style="padding: 32px 40px; display: flex; flex-direction: column; gap: 20px; height: 100%; box-sizing: border-box">

  <!-- 상단 진행 -->
  <div style="display: flex; align-items: center; gap: 16px">
    <div style="font-size: 14px; font-weight: 700; letter-spacing: -0.02em">오늘 볼 공고</div>
    <div style="flex-grow: 1; display: flex; gap: 4px">
      <div style="flex-grow: 1; height: 4px; background: #b5541f; border-radius: 2px"></div>
      <div style="flex-grow: 1; height: 4px; background: #b5541f; border-radius: 2px"></div>
      <div style="flex-grow: 1; height: 4px; background: #b5541f; border-radius: 2px"></div>
      <div style="flex-grow: 1; height: 4px; background: #cdc9c1; border-radius: 2px"></div>
      <div style="flex-grow: 1; height: 4px; background: #cdc9c1; border-radius: 2px"></div>
      <div style="flex-grow: 1; height: 4px; background: #cdc9c1; border-radius: 2px"></div>
      <div style="flex-grow: 1; height: 4px; background: #cdc9c1; border-radius: 2px"></div>
      <div style="flex-grow: 1; height: 4px; background: #cdc9c1; border-radius: 2px"></div>
    </div>
    <div style="font-size: 13px; color: #7a736a; font-variant-numeric: tabular-nums">3 / 206</div>
  </div>

  <!-- 메인 카드 -->
  <div style="flex-grow: 1; background: #fffefb; border-radius: 22px; padding: 36px 40px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 2px 3px rgba(28,26,23,.05), 0 16px 40px rgba(28,26,23,.09)">

    <div style="display: flex; align-items: flex-start; gap: 20px">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 11px">
        <div style="display: flex; align-items: center; gap: 9px">
          <span style="font-size: 11px; font-weight: 700; color: #b5541f; border: 1px solid #e3cdbb; border-radius: 999px; padding: 4px 11px">원티드</span>
          <span style="font-size: 12px; font-weight: 600; color: #7a736a">합격보상금 100만원</span>
        </div>
        <div style="font-size: 30px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.26">Staff Frontend Engineer<br>(Coupang Eats)</div>
        <div style="font-size: 16px; font-weight: 600; color: #4a443c">쿠팡</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; background: #f5f2ec; border-radius: 16px; padding: 16px 20px; flex-shrink: 0">
        <div style="font-size: 30px; font-weight: 700; color: #00a05a; letter-spacing: -0.03em; line-height: 1">4.1</div>
        <div style="font-size: 11px; color: #7a736a">잡플래닛</div>
      </div>
    </div>

    <div style="height: 1px; background: #eae6de"></div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 5px">
        <div style="font-size: 11.5px; color: #9a9288">근무지</div>
        <div style="font-size: 15px; font-weight: 600">서울 강남구</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px">
        <div style="font-size: 11.5px; color: #9a9288">경력</div>
        <div style="font-size: 15px; font-weight: 600">7-14년</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px">
        <div style="font-size: 11.5px; color: #9a9288">고용형태</div>
        <div style="font-size: 15px; font-weight: 600">정규직</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px">
      <div style="font-size: 11.5px; color: #9a9288">회사 조건</div>
      <div style="display: flex; gap: 7px; flex-wrap: wrap">
        <span style="font-size: 12.5px; font-weight: 600; color: #1c1a17; background: #f0ece4; border-radius: 999px; padding: 7px 13px">설립 4년 이상</span>
        <span style="font-size: 12.5px; font-weight: 600; color: #1c1a17; background: #f0ece4; border-radius: 999px; padding: 7px 13px">장비지원</span>
        <span style="font-size: 12.5px; font-weight: 600; color: #9a9288; background: #f6f4f0; border-radius: 999px; padding: 7px 13px">인원 급성장 없음</span>
      </div>
    </div>

    <div style="flex-grow: 1"></div>

    <div style="display: flex; gap: 10px">
      <div style="flex-grow: 1; background: #1c1a17; color: #fffefb; border-radius: 14px; padding: 16px; text-align: center; font-size: 15px; font-weight: 700">공고 보러 가기</div>
      <div style="background: #fffefb; border: 1.5px solid #d8d3ca; border-radius: 14px; padding: 16px 22px; font-size: 15px; font-weight: 700; color: #4a443c">보관</div>
      <div style="background: #fffefb; border: 1.5px solid #d8d3ca; border-radius: 14px; padding: 16px 22px; font-size: 15px; font-weight: 700; color: #4a443c">건너뛰기</div>
    </div>
  </div>

  <!-- 다음 미리보기 -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 0 4px">
    <div style="font-size: 11.5px; color: #9a9288; flex-shrink: 0">다음</div>
    <div style="flex-grow: 1; display: flex; align-items: center; gap: 10px; background: #f5f3ef; border-radius: 12px; padding: 12px 16px">
      <span style="font-size: 13.5px; font-weight: 600">프론트엔드 개발자 - 자산 서비스</span>
      <span style="font-size: 12.5px; color: #7a736a">㈜카카오페이 · 경기 성남시</span>
      <span style="flex-grow: 1"></span>
      <span style="font-size: 13px; font-weight: 700; color: #00a05a">4.3</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
